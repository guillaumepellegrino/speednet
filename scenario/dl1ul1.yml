[var.hostname]
description = "The server hostname"

[var.bandwidth]
description = "The maximum bandwidth"
default = "1G"

[var.port]
description = "The server port"
default = "4000"

[client.httpdownload]
hostname = "$(hostname)"
bandwidth = "$(bandwidth)"
revert = true

[client.httpupload]
hostname = "$(hostname)"
bandwidth = "$(bandwidth)"
revert = false
