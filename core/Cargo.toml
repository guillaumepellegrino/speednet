[package]
name = "speednet-core"
version = "0.1.0"
edition = "2021"

description = "Measure network speed - core library"
readme = "../README.md"
repository = "https://github.com/guillaumepellegrino/speednet"
license = "GPL-3.0-or-later"
authors = ["Guillaume Pellegrino <guillaume.pellegrino@yahoo.com>"]
keywords = ["network", "linux", "speedtest"]
categories = ["network-programming"]

[build-dependencies]
cc = "1.0"

[dependencies]
serde = { version = "1.0.158", features = ["derive"] }
serde_json = "1.0"
toml = "0.7.3"
clap = {version = "4.4.8", features = ["derive"]}
eyre = "0.6.8"
daemonize = "0.5.0"
socket2 = {version = "*", features = ["all"]}
libc = {version = "*", features = []}
